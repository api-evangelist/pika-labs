openapi: 3.2.0
info:
  title: Pika Labs via fal.ai Queue Cancel API
  description: Pika Labs does not publish a first-party REST API on its main domain.
  version: 1.0.0
  contact:
    name: fal.ai documentation
    url: https://fal.ai/docs/model-endpoints/queue
  license:
    name: fal.ai Proprietary
servers:
- url: https://queue.fal.run
  description: fal.ai inference queue base URL.
security:
- falKey: []
tags:
- name: Cancel
  description: Cancel an in-flight request.
paths:
  /{model_id}/requests/{request_id}/cancel:
    parameters:
    - in: path
      name: model_id
      required: true
      schema:
        type: string
    - in: path
      name: request_id
      required: true
      schema:
        type: string
    put:
      tags:
      - Cancel
      summary: Cancel an in-flight request
      operationId: cancelRequest
      responses:
        '200':
          description: Request cancellation acknowledged.
components:
  securitySchemes:
    falKey:
      type: apiKey
      in: header
      name: Authorization
      description: 'fal.ai API key sent as `Authorization: Key $FAL_KEY`.

        '
externalDocs:
  description: fal.ai Queue API documentation
  url: https://fal.ai/docs/model-endpoints/queue
